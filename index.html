<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnus promet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3F4A2A">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--olive:#3F4A2A;--olive-l:#56633b;--wood:#C8A27A;--wood-d:#8A6238;--wood-l:#F4EBDF;--bg:#fff;--err:#a12c1f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--olive);background:var(--bg)}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;margin:0}
header{background:var(--olive);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--wood)}
header h1{font-size:1.35rem}
main{max-width:640px;margin:0 auto;padding:16px}
nav{display:flex;background:var(--wood-l);border-bottom:1px solid var(--wood)}
nav button{flex:1;padding:12px 2px;border:0;background:none;font:inherit;font-size:.9rem;color:var(--olive);cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{font-weight:700;border-bottom-color:var(--olive)}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea,select{width:100%;padding:12px;font:inherit;color:var(--olive);border:1.5px solid var(--wood);border-radius:6px;background:#fff}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--wood-d);outline-offset:1px}
.btn{padding:13px 18px;border:0;border-radius:6px;background:var(--olive);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--wood);color:var(--olive)}
.btn.link{background:none;color:#fff;padding:6px 10px;border:1px solid var(--wood)}
.row{display:flex;gap:10px}.row>*{flex:1}
.sum{margin:18px 0;padding:14px;background:var(--wood-l);border-left:5px solid var(--wood);border-radius:4px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .tot{font-weight:700;font-size:1.25rem;border-top:1px solid var(--wood);margin-top:6px;padding-top:8px}
table{width:100%;border-collapse:collapse;margin:14px 0}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--wood-l)}
th:first-child,td:first-child{text-align:left}
th{background:var(--olive);color:#fff;font-size:.85rem}
tr.d{cursor:pointer}tr.d:hover{background:var(--wood-l)}
tfoot td{font-weight:700;border-top:2px solid var(--olive)}
#msg{min-height:1.5em;margin-top:10px;font-weight:600}.err{color:var(--err)}
.hide{display:none}.small{font-size:.85rem;opacity:.8}
.tbl{overflow-x:auto}
</style>
</head>
<body>
<header><h1>Magnus promet</h1><button class="btn link hide" id="out">Odjava</button></header>

<main id="login" class="hide">
  <h2>Prijava</h2>
  <label for="em">E-pošta</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Geslo</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="btn" id="in">Prijavi se</button></p>
  <div id="lmsg" class="err"></div>
</main>

<div id="app" class="hide">
  <nav role="tablist"><button role="tab" id="t1" aria-selected="true">Vnos</button><button role="tab" id="t2" aria-selected="false">Pregled</button><button role="tab" id="t4" aria-selected="false">Stroški</button><button role="tab" id="t3" aria-selected="false">Statistika</button></nav>

  <main id="v1">
    <label for="day">Datum</label><input id="day" type="date">
    <div class="row">
      <div><label for="cash">Gotovina (€)</label><input id="cash" inputmode="decimal" placeholder="0,00"></div>
      <div><label for="card">Kartica (€)</label><input id="card" inputmode="decimal" placeholder="0,00"></div>
    </div>
    <label for="sp">Posebna blagajna – gotovina (€)</label><input id="sp" inputmode="decimal" placeholder="0,00">
    <label for="note">Opomba</label><textarea id="note" rows="2" maxlength="500"></textarea>
    <div class="sum">
      <div><span>Blagajna (gotovina + kartica)</span><span id="s1"></span></div>
      <div><span>Posebna blagajna</span><span id="s2"></span></div>
      <div class="tot"><span>Skupaj</span><span id="s3"></span></div>
    </div>
    <button class="btn" id="save">Shrani vnos</button>
    <div id="msg" role="status"></div>
  </main>

  <main id="v2" class="hide">
    <label for="mon">Mesec</label><input id="mon" type="month">
    <div class="tbl"><table>
      <thead><tr><th>Dan</th><th>Gotovina</th><th>Kartica</th><th>Posebna</th><th>Skupaj</th></tr></thead>
      <tbody id="tb"></tbody><tfoot id="tf"></tfoot>
    </table></div>
    <p class="small">Klik na vrstico odpre vnos za ta dan.</p>
    <div class="row"><button class="btn" id="xl">Izvoz Excel</button><button class="btn alt" id="pdf">Izvoz PDF</button></div>
  </main>

  <main id="v3" class="hide">
    <label for="yr">Obdobje</label><select id="yr"></select>
    <div class="sum" id="st"></div>
    <div class="tbl"><table>
      <thead><tr><th>Mesec</th><th>Gotovina</th><th>Kartica</th><th>Posebna</th><th>Skupaj</th></tr></thead>
      <tbody id="sb"></tbody>
    </table></div>
    <h2>Stroški po tipih</h2>
    <div class="tbl"><table><tbody id="sx"></tbody></table></div>
  </main>

  <main id="v4" class="hide">
    <p><button class="btn alt" id="xc">Slikaj račun</button><input id="xcam" type="file" accept="image/*" capture="environment" class="hide"></p>
    <label for="xd">Datum</label><input id="xd" type="date">
    <label for="xt">Tip stroška</label><input id="xt" list="types" maxlength="40" autocomplete="off"><datalist id="types"></datalist>
    <label for="xa">Znesek (€)</label><input id="xa" inputmode="decimal" placeholder="0,00">
    <label for="xo">Opis</label><input id="xo" maxlength="300">
    <p class="row"><button class="btn" id="xs">Shrani strošek</button><button class="btn alt hide" id="xx">Prekliči</button><button class="btn alt hide" id="xdel">Izbriši</button></p>
    <div id="xmsg" role="status"></div>
    <h2>Seznam stroškov</h2>
    <label for="xm">Mesec</label><input id="xm" type="month">
    <div class="tbl"><table>
      <thead><tr><th>Datum</th><th>Tip</th><th>Opis</th><th>Znesek</th></tr></thead>
      <tbody id="xb"></tbody><tfoot id="xf"></tfoot>
    </table></div>
    <p class="small">Klik na vrstico omogoča popravljanje ali brisanje.</p>
    <div class="row"><button class="btn" id="xxl">Izvoz Excel</button><button class="btn alt" id="xpdf">Izvoz PDF</button></div>
  </main>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/xlsx.js"></script>
<script src="lib/jspdf.js"></script>
<script src="lib/autotable.js"></script>
<script>
const sb=supabase.createClient('https://rwytqfcjdwcjutknxlaf.supabase.co','sb_publishable_SapJtD54ZANKzIDVBrxBGA_h4gBfAmh');
const $=s=>document.querySelector(s);
const eur=n=>Number(n||0).toLocaleString('sl-SI',{style:'currency',currency:'EUR'});
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let rows=load('rows',{}), queue=load('queue',[]);
const persist=()=>{localStorage.setItem('rows',JSON.stringify(rows));localStorage.setItem('queue',JSON.stringify(queue))};
let ex=load('ex',{}), xq=load('xq',[]), editId=null;
const persistX=()=>{localStorage.setItem('ex',JSON.stringify(ex));localStorage.setItem('xq',JSON.stringify(xq))};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const dmy=d=>d.slice(8)+'. '+d.slice(5,7)+'. '+d.slice(0,4);

// Prijava
async function init(){
  const {data}=await sb.auth.getSession();
  const ok=!!data.session;
  $('#login').classList.toggle('hide',ok);$('#app').classList.toggle('hide',!ok);$('#out').classList.toggle('hide',!ok);
  if(ok){await sync();fill();render();xfillTypes();xrender()}
}
$('#in').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lmsg').textContent='Prijava ni uspela. Preveri e-pošto in geslo.';return}
  $('#pw').value='';init();
};
$('#out').onclick=async()=>{await sb.auth.signOut();rows={};queue=[];persist();ex={};xq=[];persistX();init()};

// Sinhronizacija
async function syncX(){
  if(xq.length){const {error}=await sb.from('expenses').upsert(xq.map(r=>({...r,updated_at:new Date().toISOString()})),{onConflict:'id'});if(!error)xq=[]}
  const {data,error}=await sb.from('expenses').select('id,day,type,amount,description').order('day',{ascending:false}).limit(3000);
  if(!error&&data){ex={};data.forEach(r=>ex[r.id]=r);xq.forEach(r=>ex[r.id]=r)}
  persistX();
}
async function sync(){
  if(!navigator.onLine)return;
  await syncX();
  if(queue.length){
    const {error}=await sb.from('daily_revenue').upsert(queue.map(r=>({...r,updated_at:new Date().toISOString()})),{onConflict:'day'});
    if(!error)queue=[];
  }
  const {data,error}=await sb.from('daily_revenue').select('day,cash,card,special_cash,note').order('day',{ascending:false}).limit(800);
  if(!error&&data){const q=Object.fromEntries(queue.map(r=>[r.day,r]));rows={};data.forEach(r=>rows[r.day]=r);Object.assign(rows,q)}
  persist();
}
addEventListener('online',async()=>{await sync();fill();render();xfillTypes();xrender()});

// Vnos
function fill(){
  const r=rows[$('#day').value]||{};
  $('#cash').value=r.cash?String(r.cash).replace('.',','):'';
  $('#card').value=r.card?String(r.card).replace('.',','):'';
  $('#sp').value=r.special_cash?String(r.special_cash).replace('.',','):'';
  $('#note').value=r.note||'';sums();
}
function sums(){
  const a=num($('#cash').value),b=num($('#card').value),c=num($('#sp').value);
  $('#s1').textContent=eur(a+b);$('#s2').textContent=eur(c);$('#s3').textContent=eur(a+b+c);
}
['cash','card','sp'].forEach(i=>$('#'+i).addEventListener('input',sums));
$('#day').addEventListener('change',()=>{$('#msg').textContent='';fill()});
$('#save').onclick=async()=>{
  const m=$('#msg');m.className='';
  const r={day:$('#day').value,cash:num($('#cash').value),card:num($('#card').value),special_cash:num($('#sp').value),note:$('#note').value.trim()||null};
  if(!r.day){m.className='err';m.textContent='Izberi datum.';return}
  if([r.cash,r.card,r.special_cash].some(v=>v<0||v>1e7)){m.className='err';m.textContent='Zneski morajo biti med 0 in 10.000.000 €.';return}
  rows[r.day]=r;
  let ok=false;
  if(navigator.onLine){const {error}=await sb.from('daily_revenue').upsert({...r,updated_at:new Date().toISOString()},{onConflict:'day'});ok=!error}
  if(!ok){queue=queue.filter(q=>q.day!==r.day);queue.push(r)}
  persist();render();
  m.textContent=ok?'Shranjeno.':'Ni povezave. Vnos je shranjen v telefonu in se bo poslal ob vrnitvi povezave.';
};

// Pregled
const monthRows=()=>Object.values(rows).filter(r=>r.day.startsWith($('#mon').value)).sort((a,b)=>a.day.localeCompare(b.day));
function render(){
  const list=monthRows(),T={cash:0,card:0,sp:0};
  const tb=$('#tb');tb.textContent='';
  list.forEach(r=>{
    T.cash+=+r.cash;T.card+=+r.card;T.sp+=+r.special_cash;
    const tr=document.createElement('tr');tr.className='d';
    [dmy(r.day).slice(0,6),eur(r.cash),eur(r.card),eur(r.special_cash),eur(+r.cash+ +r.card+ +r.special_cash)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});
    tr.onclick=()=>{$('#day').value=r.day;fill();tab(1)};tb.append(tr);
  });
  if(!list.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='V tem mesecu še ni vnosov.';tr.append(td);tb.append(tr)}
  const tf=$('#tf');tf.textContent='';const tr=document.createElement('tr');
  ['Skupaj',eur(T.cash),eur(T.card),eur(T.sp),eur(T.cash+T.card+T.sp)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});tf.append(tr);
}
function tab(n){
  [1,2,3,4].forEach(i=>{$('#v'+i).classList.toggle('hide',n!==i);$('#t'+i).setAttribute('aria-selected',n===i)});
  if(n===2)render();if(n===3)stats();if(n===4)xrender();
}
function stats(){
  const sel=$('#yr'),ys=[...new Set(Object.keys(rows).concat(Object.values(ex).map(r=>r.day)).map(d=>d.slice(0,4)))].sort().reverse();
  const cur=sel.value||ys[0]||'all';sel.textContent='';
  [['all','Vse skupaj'],...ys.map(y=>[y,'Leto '+y])].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)});
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'all';
  const list=Object.values(rows).filter(r=>sel.value==='all'||r.day.startsWith(sel.value));
  const s=(l,k)=>l.reduce((a,r)=>a+ +r[k],0),c=s(list,'cash'),k=s(list,'card'),p=s(list,'special_cash'),t=c+k+p;
  const xl=Object.values(ex).filter(r=>sel.value==='all'||r.day.startsWith(sel.value)),xs=s(xl,'amount');const st=$('#st');st.textContent='';
  [['Gotovina',eur(c)],['Kartica',eur(k)],['Blagajna skupaj',eur(c+k)],['Posebna blagajna',eur(p)],['Skupaj',eur(t),'tot'],['Stroški',eur(xs)],['Promet minus stroški',eur(t-xs),'tot'],['Dni z vnosom',list.length],['Povprečje na dan',eur(list.length?t/list.length:0)]].forEach(([a,b,cl])=>{
    const d=document.createElement('div');if(cl)d.className=cl;
    const x=document.createElement('span'),y=document.createElement('span');x.textContent=a;y.textContent=b;d.append(x,y);st.append(d);
  });
  const by={};list.forEach(r=>(by[r.day.slice(0,7)]=by[r.day.slice(0,7)]||[]).push(r));
  const tb=$('#sb');tb.textContent='';
  Object.keys(by).sort().forEach(m=>{
    const l=by[m],tr=document.createElement('tr');tr.className='d';
    [m.slice(5)+'/'+m.slice(0,4),eur(s(l,'cash')),eur(s(l,'card')),eur(s(l,'special_cash')),eur(s(l,'cash')+s(l,'card')+s(l,'special_cash'))].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});
    tr.onclick=()=>{$('#mon').value=m;tab(2)};tb.append(tr);
  });
  if(!list.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='Še ni vnosov.';tr.append(td);tb.append(tr)}
  const bt={};xl.forEach(r=>{const k=r.type.toLowerCase();(bt[k]=bt[k]||{n:r.type,v:0}).v+=+r.amount});
  const sx=$('#sx');sx.textContent='';
  Object.values(bt).sort((a,b)=>b.v-a.v).forEach(o=>{const tr=document.createElement('tr');[o.n,eur(o.v)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});sx.append(tr)});
  if(!xl.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=2;td.textContent='Še ni stroškov.';tr.append(td);sx.append(tr)}
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);$('#t3').onclick=()=>tab(3);$('#t4').onclick=()=>tab(4);$('#yr').addEventListener('change',stats);$('#mon').addEventListener('change',render);

// Izvoz
$('#xl').onclick=()=>{
  const l=monthRows(),m=$('#mon').value;
  const aoa=[['Datum','Gotovina','Kartica','Blagajna skupaj','Posebna blagajna','Skupaj','Opomba']];
  l.forEach(r=>aoa.push([dmy(r.day),+r.cash,+r.card,+r.cash+ +r.card,+r.special_cash,+r.cash+ +r.card+ +r.special_cash,r.note||'']));
  const s=k=>l.reduce((a,r)=>a+ +r[k],0);
  aoa.push(['Skupaj',s('cash'),s('card'),s('cash')+s('card'),s('special_cash'),s('cash')+s('card')+s('special_cash'),'']);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:12},{wch:12},{wch:16},{wch:16},{wch:12},{wch:40}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,m);XLSX.writeFile(wb,'Magnus-promet-'+m+'.xlsx');
};
const ascii=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d').replace(/\u0110/g,'D');
$('#pdf').onclick=()=>{
  const l=monthRows(),m=$('#mon').value,doc=new jspdf.jsPDF();
  const s=k=>l.reduce((a,r)=>a+ +r[k],0),f=n=>ascii(eur(n));
  doc.setFontSize(16);doc.text(ascii('Kavarna Magnus - promet '+m.slice(5)+'/'+m.slice(0,4)),14,16);
  doc.autoTable({startY:22,head:[['Datum','Gotovina','Kartica','Blagajna','Posebna','Skupaj','Opomba']],
    body:l.map(r=>[dmy(r.day),f(r.cash),f(r.card),f(+r.cash+ +r.card),f(r.special_cash),f(+r.cash+ +r.card+ +r.special_cash),ascii(r.note||'')]),
    foot:[['Skupaj',f(s('cash')),f(s('card')),f(s('cash')+s('card')),f(s('special_cash')),f(s('cash')+s('card')+s('special_cash')),'']],
    headStyles:{fillColor:[63,74,42]},footStyles:{fillColor:[200,162,122],textColor:[63,74,42]},styles:{fontSize:9}});
  doc.save('Magnus-promet-'+m+'.pdf');
};

// Stroški
const DEF=['Agrohram','Trgovina','Material','Petrol','Drugo'];
function typeList(){const m={};DEF.forEach(t=>m[t.toLowerCase()]=t);Object.values(ex).forEach(r=>{const k=r.type.toLowerCase();if(!m[k])m[k]=r.type});return Object.values(m)}
function xfillTypes(){const d=$('#types');d.textContent='';typeList().forEach(t=>{const o=document.createElement('option');o.value=t;d.append(o)})}
const normType=t=>{t=t.trim();return typeList().find(x=>x.toLowerCase()===t.toLowerCase())||t};
const xmRows=()=>Object.values(ex).filter(r=>r.day.startsWith($('#xm').value)).sort((a,b)=>a.day.localeCompare(b.day));
function xclear(){editId=null;$('#xd').value=today();$('#xt').value='';$('#xa').value='';$('#xo').value='';$('#xx').classList.add('hide');$('#xdel').classList.add('hide')}
function xrender(){
  const l=xmRows(),tb=$('#xb');tb.textContent='';let T=0;
  l.forEach(r=>{
    T+=+r.amount;const tr=document.createElement('tr');tr.className='d';
    [dmy(r.day).slice(0,6),r.type,r.description||'',eur(r.amount)].forEach((t,i)=>{const td=document.createElement('td');td.textContent=t;if(i===1||i===2)td.style.textAlign='left';tr.append(td)});
    tr.onclick=()=>{editId=r.id;$('#xd').value=r.day;$('#xt').value=r.type;$('#xa').value=String(r.amount).replace('.',',');$('#xo').value=r.description||'';$('#xx').classList.remove('hide');$('#xdel').classList.remove('hide');$('#xmsg').textContent='';scrollTo(0,0)};
    tb.append(tr);
  });
  if(!l.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='V tem mesecu še ni stroškov.';tr.append(td);tb.append(tr)}
  const tf=$('#xf');tf.textContent='';const tr=document.createElement('tr');
  ['Skupaj','','',eur(T)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});tf.append(tr);
}
$('#xm').addEventListener('change',xrender);$('#xx').onclick=()=>{xclear();$('#xmsg').textContent=''};
$('#xs').onclick=async()=>{
  const m=$('#xmsg');m.className='err';
  const r={id:editId||crypto.randomUUID(),day:$('#xd').value,type:normType($('#xt').value),amount:num($('#xa').value),description:$('#xo').value.trim()||null};
  if(!r.day||!r.type){m.textContent='Vpiši datum in tip stroška.';return}
  if(!(r.amount>0)||r.amount>1e7){m.textContent='Znesek mora biti večji od 0 in manjši od 10.000.000 €.';return}
  ex[r.id]=r;let ok=false;
  if(navigator.onLine){const {error}=await sb.from('expenses').upsert({...r,updated_at:new Date().toISOString()},{onConflict:'id'});ok=!error}
  if(!ok){xq=xq.filter(q=>q.id!==r.id);xq.push(r)}
  persistX();xclear();xfillTypes();xrender();
  m.className='';m.textContent=ok?'Shranjeno.':'Ni povezave. Strošek je shranjen v telefonu in se bo poslal ob vrnitvi povezave.';
};
$('#xdel').onclick=async()=>{
  const m=$('#xmsg');if(!editId||!confirm('Izbrišem ta strošek?'))return;
  if(!navigator.onLine){m.className='err';m.textContent='Brisanje zahteva internetno povezavo.';return}
  const {error}=await sb.from('expenses').delete().eq('id',editId);
  if(error){m.className='err';m.textContent='Brisanje ni uspelo.';return}
  delete ex[editId];xq=xq.filter(q=>q.id!==editId);persistX();xclear();xrender();m.className='';m.textContent='Izbrisano.';
};
$('#xxl').onclick=()=>{
  const l=xmRows(),m=$('#xm').value,aoa=[['Datum','Tip','Opis','Znesek']];
  l.forEach(r=>aoa.push([dmy(r.day),r.type,r.description||'',+r.amount]));
  aoa.push(['Skupaj','','',l.reduce((a,r)=>a+ +r.amount,0)]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:16},{wch:40},{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,m);XLSX.writeFile(wb,'Magnus-stroski-'+m+'.xlsx');
};
$('#xpdf').onclick=()=>{
  const l=xmRows(),m=$('#xm').value,doc=new jspdf.jsPDF(),T=l.reduce((a,r)=>a+ +r.amount,0);
  doc.setFontSize(16);doc.text(ascii('Kavarna Magnus - stroski '+m.slice(5)+'/'+m.slice(0,4)),14,16);
  doc.autoTable({startY:22,head:[['Datum','Tip','Opis','Znesek']],body:l.map(r=>[dmy(r.day),ascii(r.type),ascii(r.description||''),ascii(eur(r.amount))]),
    foot:[['Skupaj','','',ascii(eur(T))]],headStyles:{fillColor:[63,74,42]},footStyles:{fillColor:[200,162,122],textColor:[63,74,42]},styles:{fontSize:9}});
  doc.save('Magnus-stroski-'+m+'.pdf');
};
$('#xc').onclick=()=>$('#xcam').click();
$('#xcam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const m=$('#xmsg');m.className='';
  if(!navigator.onLine){m.className='err';m.textContent='Branje računa zahteva internetno povezavo.';return}
  m.textContent='Berem račun ...';$('#xc').disabled=true;
  try{
    const bmp=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const image=cv.toDataURL('image/jpeg',0.85).split(',')[1];
    const {data,error}=await sb.functions.invoke('smooth-responder',{body:{image,mime:'image/jpeg',types:typeList()}});
    if(error||!data||data.error){let d='napaka';try{d=(error&&error.context?await error.context.json():data).error||d}catch(_){}throw new Error(d)}
    xclear();const miss=[];
    if(data.day)$('#xd').value=data.day;else miss.push('datum');
    if(data.type)$('#xt').value=data.type;else miss.push('tip');
    if(data.amount>0)$('#xa').value=String(data.amount).replace('.',',');else miss.push('znesek');
    if(data.description)$('#xo').value=data.description;else miss.push('opis');
    m.textContent=miss.length?'Ni prebrano: '+miss.join(', ')+'. Dopolni in shrani.':'Preveri podatke in klikni Shrani strošek.';
  }catch(err){m.className='err';m.textContent='Branje računa ni uspelo ('+err.message+'). Vnesi ročno.'}
  $('#xc').disabled=false;
};
$('#xd').value=today();$('#xm').value=today().slice(0,7);xfillTypes();
$('#day').value=today();$('#mon').value=today().slice(0,7);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script>
